<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520" fill="none">
  <defs>
    <filter id="soft-shadow-m" x="-20%" y="-10%" width="140%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="16" flood-color="#1E3A5F" flood-opacity="0.22" />
    </filter>
    <filter id="scoop-shadow-m" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1b5e20" flood-opacity="0.25" />
    </filter>
    <!-- Cup Gradients -->
    <linearGradient id="cup-grad-m" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#F2FBF4" />
      <stop offset="70%" stop-color="#DCF5E2" />
      <stop offset="100%" stop-color="#BEEDC9" />
    </linearGradient>
    <linearGradient id="cup-rim-m" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E3F7E8" />
      <stop offset="100%" stop-color="#AEE9BD" />
    </linearGradient>
    <!-- Matcha Ice Cream Gradients -->
    <linearGradient id="matcha-base" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#81C784" />
      <stop offset="45%" stop-color="#4CAF50" />
      <stop offset="85%" stop-color="#388E3C" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>
  </defs>

  <!-- Ambient Floor Shadow -->
  <ellipse cx="200" cy="495" rx="140" ry="20" fill="#1E3A5F" opacity="0.2" filter="blur(8px)" />
  <ellipse cx="200" cy="492" rx="100" ry="12" fill="#1E3A5F" opacity="0.3" filter="blur(4px)" />

  <g filter="url(#soft-shadow-m)">
    <!-- ── ICE CREAM SCOOPS (Top) ── -->
    <g filter="url(#scoop-shadow-m)">
      <!-- Back Scoop / Mound -->
      <circle cx="200" cy="190" r="110" fill="url(#matcha-base)" />

      <!-- Top High Scoop with textured swirls -->
      <path d="M120,180 C110,130 150,70 200,60 C250,70 290,130 280,180 C260,200 140,200 120,180 Z" fill="url(#matcha-base)" />
      
      <!-- Folds / Highlights -->
      <path d="M140,150 Q200,120 260,150 Q200,170 140,150 Z" fill="#A5D6A7" opacity="0.8" />
      <path d="M160,110 Q200,90 240,110 Q200,125 160,110 Z" fill="#C8E6C9" opacity="0.7" />
      <ellipse cx="185" cy="85" rx="28" ry="16" fill="#E8F5E9" opacity="0.8" />

      <!-- High gloss highlights -->
      <path d="M160,80 C175,70 205,70 215,78 C195,80 175,90 160,80 Z" fill="#FFFFFF" opacity="0.6" />
      <circle cx="230" cy="130" r="7" fill="#FFFFFF" opacity="0.5" />

      <!-- White chocolate swirl / matcha powder dust -->
      <path d="M130,195 Q170,165 210,190 Q250,215 270,195" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.7" />
      <circle cx="165" cy="115" r="2" fill="#2E7D32" />
      <circle cx="215" cy="105" r="1.5" fill="#2E7D32" />
      <circle cx="185" cy="145" r="2" fill="#2E7D32" />
    </g>

    <!-- ── CUP CONTAINER (Body) ── -->
    <path d="M90,230 L120,470 C120,470 140,488 200,488 C260,488 280,470 280,470 L310,230 Z" fill="url(#cup-grad-m)" />

    <!-- Cup Rim (Lip) -->
    <ellipse cx="200" cy="230" rx="110" ry="16" fill="url(#cup-rim-m)" stroke="#81C784" stroke-width="2" />
    <path d="M120,470 C140,488 260,488 280,470" stroke="#81C784" stroke-width="3" fill="none" />

    <!-- Shading on Cup -->
    <path d="M90,230 L120,470 C120,470 145,482 170,485 L145,245 C120,243 100,238 90,230 Z" fill="#1E3A5F" opacity="0.06" />
    <path d="M310,230 L280,470 C280,470 255,482 230,485 L255,245 C280,243 300,238 310,230 Z" fill="#1B5E20" opacity="0.12" />

    <!-- ── CUP GRAPHIC BRANDING ── -->
    <g transform="translate(0, 20)">
      <!-- Wave Band on Cup -->
      <path d="M98,310 Q145,290 200,310 Q255,330 302,310 L293,365 Q250,385 200,365 Q150,345 107,365 Z" fill="#10B981" opacity="0.9" />

      <!-- Center Logo / Emblem -->
      <circle cx="200" cy="355" r="44" fill="#FFFFFF" filter="url(#scoop-shadow-m)" />
      
      <!-- Brand Text inside Emblem -->
      <text x="200" y="352" text-anchor="middle" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="24" fill="#FF6B9D" letter-spacing="1">pea</text>
      <text x="200" y="372" text-anchor="middle" font-family="'Nunito', sans-serif" font-weight="800" font-size="10" fill="#1E3A5F" letter-spacing="2">ICE CREAM</text>

      <!-- Flavor Pill on Cup -->
      <rect x="135" y="415" width="130" height="26" rx="13" fill="#1E3A5F" />
      <text x="200" y="432" text-anchor="middle" font-family="'Nunito', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" letter-spacing="0.5">Matcha Kyoto</text>
    </g>
  </g>
</svg>
